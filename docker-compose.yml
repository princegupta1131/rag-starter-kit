# OPTIONAL — only if you don't already have a Postgres with pgvector.
#   docker compose up -d
# then in backend/.env:
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rag_starter
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_starter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
